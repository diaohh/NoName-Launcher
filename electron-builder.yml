appId: com.nonamelauncher.app
productName: NoNameLauncher
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - "!out/**/*.map"
  # buildResources is left out of the app by default. The window icon is read at runtime
  # (`?asset&asarUnpack` in src/main/index.js), so it ships, outside the asar.
  - resources/icon.png
asarUnpack:
  - resources/icon.png
win:
  target:
    - nsis
    - portable
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  icon: resources/icon.png
mac:
  target: dmg
  icon: resources/icon.png
asar: true
