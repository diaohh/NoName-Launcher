appId: com.nonamelauncher.app
productName: NoNameLauncher
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - "!out/**/*.map"
win:
  target:
    - nsis
    - portable
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  icon: resources/icon.png
mac:
  target: dmg
  icon: resources/icon.png
asar: true
